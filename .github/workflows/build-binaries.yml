name: Build ARM64 Binaries

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  download-prebuilt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create output dirs
        run: mkdir -p output/binaries output/wordlists

      - name: Download pre-built ARM64 binaries
        continue-on-error: true
        run: |
          cd output/binaries

          download() {
            local url="$1" dest="$2"
            wget -q "$url" -O "$dest" 2>/dev/null || echo "  [!] Failed: $dest"
          }

          download "https://nmap.org/dist/nmap-7.94-linux-arm64.tar.bz2" /tmp/nmap.tar.bz2
          [ -f /tmp/nmap.tar.bz2 ] && tar -xjf /tmp/nmap.tar.bz2 -C /tmp/ && cp /tmp/nmap-7.94/bin/nmap . 2>/dev/null || true

          download "https://hashcat.net/files/hashcat-6.2.6.7z" /tmp/hc.7z
          [ -f /tmp/hc.7z ] && 7z x /tmp/hc.7z -o/tmp/hc/ 2>/dev/null && cp /tmp/hc/hashcat-6.2.6/hashcat.bin hashcat 2>/dev/null || true

          FRIDA=$(curl -s https://api.github.com/repos/frida/frida/releases/latest 2>/dev/null | grep -m1 '"tag_name"' | cut -d'"' -f4)
          if [ -n "$FRIDA" ]; then
            download "https://github.com/frida/frida/releases/download/$FRIDA/frida-server-${FRIDA}-android-arm64.xz" /tmp/frida.xz
            [ -f /tmp/frida.xz ] && xz -d /tmp/frida.xz 2>/dev/null && cp /tmp/frida-server-${FRIDA}-android-arm64 frida-server 2>/dev/null || true
          fi

          JADX=$(curl -s https://api.github.com/repos/skylot/jadx/releases/latest 2>/dev/null | grep '"tag_name"' | cut -d'"' -f4)
          if [ -n "$JADX" ]; then
            download "https://github.com/skylot/jadx/releases/download/$JADX/jadx-${JADX}.zip" /tmp/jadx.zip
            [ -f /tmp/jadx.zip ] && unzip -o /tmp/jadx.zip -d jadx/ 2>/dev/null || true
          fi

          download "https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar" apktool.jar
          download "https://exiftool.org/Image-ExifTool-12.70.tar.gz" /tmp/et.tar.gz
          [ -f /tmp/et.tar.gz ] && tar -xzf /tmp/et.tar.gz -C /tmp/ 2>/dev/null && cp /tmp/Image-ExifTool-12.70/exiftool . && cp -r /tmp/Image-ExifTool-12.70/lib exiftool_lib 2>/dev/null || true

          download "https://gitlab.com/exploit-database/exploitdb/-/archive/main/exploitdb-main.tar.gz" /tmp/edb.tar.gz
          [ -f /tmp/edb.tar.gz ] && tar -xzf /tmp/edb.tar.gz -C /tmp/ 2>/dev/null && cp /tmp/exploitdb-main/searchsploit . 2>/dev/null || true

          for tool in lynis rkhunter; do
            download "https://github.com/$tool/$tool/archive/refs/heads/master.tar.gz" /tmp/$tool.tar.gz
            [ -f /tmp/$tool.tar.gz ] && tar -xzf /tmp/$tool.tar.gz -C /tmp/ 2>/dev/null && cp /tmp/$tool-master/$tool . 2>/dev/null || true
          done

          chmod +x * 2>/dev/null || true
          echo "[✓] Pre-built downloads complete"
          ls -la

      - name: Download wordlists
        continue-on-error: true
        run: |
          cd output/wordlists
          wget -q "https://github.com/brannondorsey/naive-hashcat/releases/download/data" -O rockyou.txt 2>/dev/null || true
          wget -q "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Passwords/Common-Credentials/10-million-password-list-top-100000.txt" -O common_100k.txt 2>/dev/null || true
          wget -q "https://raw.githubusercontent.com/hashcat/hashcat/master/rules/best64.rule" 2>/dev/null || true
          wget -q "https://raw.githubusercontent.com/hashcat/hashcat/master/rules/dive.rule" 2>/dev/null || true
          echo "[✓] Wordlists downloaded"
          ls -la

      - name: Upload prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-binaries
          path: output/
          retention-days: 7

  compile-c-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: download-prebuilt
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            build-essential cmake autoconf automake libtool \
            libssl-dev libpcap-dev libncurses5-dev zlib1g-dev 2>/dev/null

      - name: Download prebuilt artifact
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-binaries
          path: output/

      - name: Cross-compile C tools
        continue-on-error: true
        run: |
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++

          compile_tool() {
            local name="$1" url="$2" build_cmd="$3"
            echo "  [>] Building $name..."
            cd /tmp
            git clone --depth 1 "$url" "$name" 2>/dev/null || true
            cd "$name" && eval "$build_cmd" 2>/dev/null && echo "  [✓] $name" || echo "  [✗] $name failed"
          }

          compile_tool "aircrack-ng" "https://github.com/aircrack-ng/aircrack-ng.git" \
            "autoreconf -i && ./configure --host=aarch64-linux-gnu && make -j$(nproc) && cp src/aircrack-ng ../../output/binaries/"

          compile_tool "john" "https://github.com/openwall/john.git" \
            "cd src && ./configure --host=aarch64-linux-gnu --disable-openmp && make -j$(nproc) && cp ../run/john ../../output/binaries/"

          compile_tool "hydra" "https://github.com/vanhauser-thc/thc-hydra.git" \
            "./configure --host=aarch64-linux-gnu && make -j$(nproc) && cp hydra ../../output/binaries/"

          compile_tool "masscan" "https://github.com/robertdavidgraham/masscan.git" \
            "make -j$(nproc) CC=aarch64-linux-gnu-gcc && cp bin/masscan ../../output/binaries/"

          compile_tool "dsniff" "https://github.com/dunbar/cyberdsniff.git" \
            "./configure --host=aarch64-linux-gnu && make -j$(nproc) && cp arpspoof/arpspoof ../../output/binaries/arpspoof"

          chmod +x ../../output/binaries/* 2>/dev/null || true
          echo "[✓] C tools compiled"

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-binaries
          path: output/
          retention-days: 7

  compile-go-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: download-prebuilt
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download prebuilt artifact
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-binaries
          path: output/

      - name: Cross-compile Go tools
        continue-on-error: true
        run: |
          export GOOS=linux GOARCH=arm64 CGO_ENABLED=1 CC=aarch64-linux-gnu-gcc

          build_go() {
            local name="$1" url="$2"
            echo "  [>] Building $name..."
            cd /tmp
            git clone --depth 1 "$url" "$name" 2>/dev/null || true
            cd "$name" && go build -o "../../output/binaries/$name" . 2>/dev/null && echo "  [✓] $name" || echo "  [✗] $name failed"
          }

          build_go "gobuster" "https://github.com/OJ/gobuster.git"
          build_go "ffuf" "https://github.com/ffuf/ffuf.git"
          build_go "cameradar" "https://github.com/Ullaakut/cameradar.git"

          chmod +x ../../output/binaries/* 2>/dev/null || true
          echo "[✓] Go tools compiled"

      - name: Upload go artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: output/
          retention-days: 7

  bundle-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Clone Python tool sources
        continue-on-error: true
        run: |
          mkdir -p output/python_tools

          clone_tool() {
            local name="$1" url="$2"
            echo "  [>] Cloning $name..."
            git clone --depth 1 "$url" "output/python_tools/$name" 2>/dev/null && echo "  [✓] $name" || echo "  [✗] $name failed"
          }

          clone_tool "sqlmap" "https://github.com/sqlmapproject/sqlmap.git"
          clone_tool "nikto" "https://github.com/sullo/nikto.git"
          clone_tool "wfuzz" "https://github.com/xmendez/wfuzz.git"
          clone_tool "routersploit" "https://github.com/threat9/routersploit.git"
          clone_tool "maigret" "https://github.com/soxoj/maigret.git"
          clone_tool "holehe" "https://github.com/megadose/holehe.git"
          clone_tool "photon" "https://github.com/s0md3v/photon.git"
          clone_tool "instaloader" "https://github.com/instaloader/instaloader.git"
          clone_tool "snscrape" "https://github.com/JustAnotherArchivist/snscrape.git"
          clone_tool "h8mail" "https://github.com/khast3x/h8mail.git"
          clone_tool "osintgram" "https://github.com/Datalux/Osintgram.git"
          clone_tool "volatility" "https://github.com/volatilityfoundation/volatility.git"
          clone_tool "hash-identifier" "https://github.com/blackploit/hash-identifier.git"
          clone_tool "cewl" "https://github.com/digininja/cewl.git"
          clone_tool "binwalk" "https://github.com/ReFirmLabs/binwalk.git"
          clone_tool "wifite" "https://github.com/derv82/wifite.git"
          clone_tool "airgeddon" "https://github.com/v1s1t0r1sh3r3/airgeddon.git"
          clone_tool "impacket" "https://github.com/SecureAuthCorp/impacket.git"
          clone_tool "phoneinfoga" "https://github.com/sundowndev/phoneinfoga.git"

          echo "[✓] Python tools bundled"
          ls output/python_tools/

      - name: Upload python artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-tools
          path: output/
          retention-days: 7

  package-all:
    runs-on: ubuntu-latest
    needs: [compile-c-tools, compile-go-tools, bundle-python]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Merge and package
        run: |
          mkdir -p final/binaries final/wordlists final/python_tools

          # Merge everything
          cp -r artifacts/binaries/* final/binaries/ 2>/dev/null || true
          cp -r artifacts/wordlists/* final/wordlists/ 2>/dev/null || true
          cp -r artifacts/python_tools/* final/python_tools/ 2>/dev/null || true

          chmod +x final/binaries/* 2>/dev/null || true

          echo "=== Final contents ==="
          echo "Binaries: $(ls final/binaries/ 2>/dev/null | wc -l)"
          echo "Wordlists: $(ls final/wordlists/ 2>/dev/null | wc -l)"
          echo "Python tools: $(ls final/python_tools/ 2>/dev/null | wc -l)"

          cd final
          zip -r "${{ github.workspace }}/cyberlab-binaries.zip" binaries/ wordlists/ python_tools/
          cd "${{ github.workspace }}"

          echo "[✓] Package created: $(ls -lh cyberlab-binaries.zip)"

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberlab-binaries
          path: cyberlab-binaries.zip
          retention-days: 7

      - name: Create Release
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        with:
          tag_name: binaries-${{ github.run_number }}
          name: ARM64 Binaries ${{ github.run_number }}
          files: cyberlab-binaries.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
