name: Build ARM64 Binaries

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  download-prebuilt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create output dirs
        run: mkdir -p output/binaries output/wordlists

      - name: Download pre-built ARM64 binaries
        continue-on-error: true
        run: |
          cd output/binaries

          # nmap (official ARM64)
          wget -q "https://nmap.org/dist/nmap-7.94-linux-arm64.tar.bz2" -O /tmp/nmap.tar.bz2 && \
            tar -xjf /tmp/nmap.tar.bz2 -C /tmp/ && cp /tmp/nmap-7.94/bin/nmap . || true

          # hashcat (official ARM64)
          wget -q "https://hashcat.net/files/hashcat-6.2.6.7z" -O /tmp/hc.7z && \
            7z x /tmp/hc.7z -o/tmp/hc/ && cp /tmp/hc/hashcat-6.2.6/hashcat.bin hashcat || true

          # frida-server (GitHub releases)
          FRIDA=$(curl -s https://api.github.com/repos/frida/frida/releases/latest | grep -m1 '"tag_name"' | cut -d'"' -f4)
          wget -q "https://github.com/frida/frida/releases/download/$FRIDA/frida-server-${FRIDA}-android-arm64.xz" -O /tmp/frida.xz && \
            xz -d /tmp/frida.xz && cp /tmp/frida-server-${FRIDA}-android-arm64 frida-server || true

          # jadx (pre-built)
          JADX=$(curl -s https://api.github.com/repos/skylot/jadx/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          wget -q "https://github.com/skylot/jadx/releases/download/$JADX/jadx-${JADX}.zip" -O /tmp/jadx.zip && \
            unzip -o /tmp/jadx.zip -d jadx/ || true

          # apktool (JAR)
          wget -q "https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar" -O apktool.jar || true

          # exiftool (Perl)
          wget -q "https://exiftool.org/Image-ExifTool-12.70.tar.gz" -O /tmp/et.tar.gz && \
            tar -xzf /tmp/et.tar.gz -C /tmp/ && cp /tmp/Image-ExifTool-12.70/exiftool . && \
            cp -r /tmp/Image-ExifTool-12.70/lib exiftool_lib || true

          # searchsploit
          wget -q "https://gitlab.com/exploit-database/exploitdb/-/archive/main/exploitdb-main.tar.gz" -O /tmp/edb.tar.gz && \
            tar -xzf /tmp/edb.tar.gz -C /tmp/ && cp /tmp/exploitdb-main/searchsploit . || true

          # scripts (shell/perl)
          for tool in lynis rkhunter; do
            wget -q "https://github.com/$tool/$tool/archive/refs/heads/master.tar.gz" -O /tmp/$tool.tar.gz && \
              tar -xzf /tmp/$tool.tar.gz -C /tmp/ && cp /tmp/$tool-master/$tool . || true
          done

          # foremost
          wget -q "https://github.com/foremost/foremost/archive/refs/heads/master.tar.gz" -O /tmp/foremost.tar.gz && \
            tar -xzf /tmp/foremost.tar.gz -C /tmp/ && cd /tmp/foremost-master && make && \
            cp foremost ../../output/binaries/ || true

          chmod +x * 2>/dev/null || true
          echo "Pre-built downloads complete"

      - name: Download wordlists
        continue-on-error: true
        run: |
          cd output/wordlists
          wget -q "https://github.com/brannondorsey/naive-hashcat/releases/download/data/rockyou.txt" || true
          wget -q "https://raw.githubusercontent.com/danielmiessler/SecLists/master/Passwords/Common-Credentials/10-million-password-list-top-100000.txt" -O common_100k.txt || true
          wget -q "https://raw.githubusercontent.com/hashcat/hashcat/master/rules/best64.rule" || true
          wget -q "https://raw.githubusercontent.com/hashcat/hashcat/master/rules/dive.rule" || true
          echo "Wordlists downloaded"

      - name: Upload prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-binaries
          path: output/
          retention-days: 7

  compile-c-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: download-prebuilt
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            build-essential cmake autoconf automake libtool \
            libssl-dev libpcap-dev libncurses5-dev zlib1g-dev

      - name: Download prebuilt artifact
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-binaries
          path: output/

      - name: Cross-compile C tools
        continue-on-error: true
        run: |
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
          export CHOST=aarch64-linux-gnu

          # aircrack-ng
          cd /tmp
          git clone --depth 1 https://github.com/aircrack-ng/aircrack-ng.git
          cd aircrack-ng && autoreconf -i && \
            ./configure --host=aarch64-linux-gnu && make -j$(nproc) && \
            cp src/aircrack-ng ../../output/binaries/ || true

          # john
          cd /tmp && git clone --depth 1 https://github.com/openwall/john.git
          cd john/src && ./configure --host=aarch64-linux-gnu --disable-openmp && \
            make -j$(nproc) && cp ../run/john ../../output/binaries/ || true

          # hydra
          cd /tmp && git clone --depth 1 https://github.com/vanhauser-thc/thc-hydra.git
          cd thc-hydra && ./configure --host=aarch64-linux-gnu && \
            make -j$(nproc) && cp hydra ../../output/binaries/ || true

          # masscan
          cd /tmp && git clone --depth 1 https://github.com/robertdavidgraham/masscan.git
          cd masscan && make -j$(nproc) CC=aarch64-linux-gnu-gcc && \
            cp bin/masscan ../../output/binaries/ || true

          # dsniff (arpspoof)
          cd /tmp && git clone --depth 1 https://github.com/dunbar/cyberdsniff.git dsniff
          cd dsniff && ./configure --host=aarch64-linux-gnu && \
            make -j$(nproc) && cp arpspoof/arpspoof ../../output/binaries/arpspoof || true

          chmod +x ../../output/binaries/* 2>/dev/null || true
          echo "C tools compiled"

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-binaries
          path: output/
          retention-days: 7

  compile-go-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: download-prebuilt
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download prebuilt artifact
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-binaries
          path: output/

      - name: Cross-compile Go tools
        run: |
          export GOOS=linux GOARCH=arm64 CGO_ENABLED=1 CC=aarch64-linux-gnu-gcc

          # gobuster
          cd /tmp && git clone --depth 1 https://github.com/OJ/gobuster.git
          cd gobuster && go build -o ../../output/binaries/gobuster . || true

          # ffuf
          cd /tmp && git clone --depth 1 https://github.com/ffuf/ffuf.git
          cd ffuf && go build -o ../../output/binaries/ffuf . || true

          # cameradar
          cd /tmp && git clone --depth 1 https://github.com/Ullaakut/cameradar.git
          cd cameradar && go build -o ../../output/binaries/cameradar . || true

          chmod +x ../../output/binaries/* 2>/dev/null || true
          echo "Go tools compiled"

      - name: Upload go artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: output/
          retention-days: 7

  bundle-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt artifact
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-binaries
          path: output/

      - name: Clone Python tool sources
        continue-on-error: true
        run: |
          mkdir -p output/python_tools

          for repo in \
            "sqlmapproject/sqlmap" "sullo/nikto" "xmendez/wfuzz" \
            "threat9/routersploit" "soxoj/maigret" "megadose/holehe" \
            "s0md3v/photon" "instaloader/instaloader" "JustAnotherArchivist/snscrape" \
            "khast3x/h8mail" "Datalux/Osintgram" "volatilityfoundation/volatility" \
            "blackploit/hash-identifier" "digininja/cewl" "ReFirmLabs/binwalk" \
            "derv82/wifite" "v1s1t0r1sh3r3/airgeddon" "SecureAuthCorp/impacket" \
            "sundowndev/phoneinfoga"; do
            name=$(echo "$repo" | cut -d'/' -f2)
            git clone --depth 1 "https://github.com/$repo.git" "output/python_tools/$name" || true
          done

          echo "Python tools bundled"

      - name: Upload python artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-tools
          path: output/
          retention-days: 7

  package-all:
    runs-on: ubuntu-latest
    needs: [compile-c-tools, compile-go-tools, bundle-python]
    steps:
      - uses: actions/checkout@v4

      - name: Download prebuilt artifact
        uses: actions/download-artifact@v4
        with:
          name: prebuilt-binaries
          path: artifacts/prebuilt

      - name: Download compiled artifact
        uses: actions/download-artifact@v4
        with:
          name: compiled-binaries
          path: artifacts/compiled

      - name: Download go artifact
        uses: actions/download-artifact@v4
        with:
          name: go-binaries
          path: artifacts/go

      - name: Download python artifact
        uses: actions/download-artifact@v4
        with:
          name: python-tools
          path: artifacts/python

      - name: Merge and package
        run: |
          mkdir -p final/binaries final/wordlists final/python_tools

          # Merge all binaries (order matters: later overrides earlier)
          cp -r artifacts/prebuilt/binaries/* final/binaries/ 2>/dev/null || true
          cp -r artifacts/compiled/binaries/* final/binaries/ 2>/dev/null || true
          cp -r artifacts/go/binaries/* final/binaries/ 2>/dev/null || true

          # Merge wordlists
          cp -r artifacts/prebuilt/wordlists/* final/wordlists/ 2>/dev/null || true

          # Merge python tools
          cp -r artifacts/python/python_tools/* final/python_tools/ 2>/dev/null || true

          # Set permissions
          chmod +x final/binaries/* 2>/dev/null || true

          # List what we have
          echo "=== Binaries ==="
          ls final/binaries/ 2>/dev/null || echo "(none)"
          echo "=== Wordlists ==="
          ls final/wordlists/ 2>/dev/null || echo "(none)"

          # Create final package in repo root
          cd final
          zip -r "${{ github.workspace }}/cyberlab-binaries.zip" binaries/ wordlists/ python_tools/
          cd "${{ github.workspace }}"

          echo "Package created:"
          ls -lh cyberlab-binaries.zip

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberlab-binaries
          path: ${{ github.workspace }}/cyberlab-binaries.zip
          retention-days: 7

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: binaries-${{ github.run_number }}
          name: ARM64 Binaries ${{ github.run_number }}
          files: ${{ github.workspace }}/cyberlab-binaries.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
